<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Converter - Math Toolkit</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="converter-page">

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-calculator"></i> Math Toolkit
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="number-converter.html" class="active">Number Converter</a>
            <a href="calculator.html">SCI-Calculator</a>
            <a href="bmi-calculator.html">BMI Calculator</a>
            <a href="cgpa-calculator.html">CGPA Calculator</a>
            <a href="https://masud.aio.bd/" target="_blank" rel="noopener noreferrer">About Me</a> 
        </div>
    </nav>

    <main class="main-content">
        <div class="converter-card">
            <h2>Number Converter</h2>
            
            <div class="form-group">
                <label for="numInput">Enter Number</label>
                <input type="text" id="numInput" placeholder="Type here... (e.g., 1010 or FF)" oninput="doConversion()">
            </div>

            <div class="form-group">
                <label for="baseSelect">Current Base</label>
                <select id="baseSelect" onchange="doConversion()">
                    <option value="2">Binary (Base 2)</option>
                    <option value="8">Octal (Base 8)</option>
                    <option value="10" selected>Decimal (Base 10)</option>
                    <option value="16">Hexadecimal (Base 16)</option>
                </select>
            </div>

            <div class="results-grid">
                <div class="result-box">
                    <small>Binary</small>
                    <div id="outBin" class="result-value">---</div>
                </div>
                <div class="result-box">
                    <small>Octal</small>
                    <div id="outOct" class="result-value">---</div>
                </div>
                <div class="result-box">
                    <small>Decimal</small>
                    <div id="outDec" class="result-value">---</div>
                </div>
                <div class="result-box">
                    <small>Hexadecimal</small>
                    <div id="outHex" class="result-value">---</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Math Toolkit | Designed & Developed by <a href="https://masud.aio.bd" target="_blank" rel="noopener noreferrer">Md. Masud Rana</a></p>
            <div class="social-links">
                <a href="https://github.com/masud770" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/masudr760/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="../js/convertar.js"></script>
</body>
</html>
